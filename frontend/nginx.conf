server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location /api/v0/auth/ { proxy_pass http://host.docker.internal:8082; }
 location /api/v0/users/ { proxy_pass http://host.docker.internal:8082; }
 location /api/v0/applications { proxy_pass http://host.docker.internal:8083; }
 location /products { proxy_pass http://host.docker.internal:8081; }
}
